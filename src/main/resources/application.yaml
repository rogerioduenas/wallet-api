spring:
  application:
    name: wallet-api
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:wallet_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
api:
  security:
    jwt:
      secret: ${SECRET_KEY:defaultSecretKeyForTestingPurposesOnlyNeedsToBeLongEnough32Bytes}
      expiration-ms: ${EXPIRATION_TOKEN:3600000}
app:
  admin:
    email: ${ADMIN_EMAIL:admin@email.com}
    password: ${ADMIN_PASSWORD:admin123}